[project]
name = "repolens"
version = "0.0.0"
description = "Code-aware RAG with file and line citations and a measured eval suite."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.162.0",
    "httpx2==2.16.0",
    "pathspec==1.1.1",
    "pgvector==0.5.1",
    "psycopg[binary]==3.3.8",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "python-dotenv==1.2.4",
    "sqlalchemy==2.1.8",
]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pip-audit==2.10.1",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.uv]
package = false
# Same supply-chain rule as the pnpm release-age policy: ignore releases under a day old.
exclude-newer = "1 day"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
