# Weekly dependency updates, grouped to keep the pull requests few. Every update goes through CI
# before it can be merged; a new release waits a week first (cooldown).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  # Base image tags and their digests, in the Dockerfiles and in docker-compose.yml.
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Stay on the runtime lines the project targets: Python 3.12, Node.js 24 LTS and nginx stable
    # (even minor versions). Moving to a new line is a deliberate change, not a weekly bump.
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: node
        update-types: [version-update:semver-major]
      - dependency-name: nginxinc/nginx-unprivileged
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      docker-images:
        patterns: ['*']

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
